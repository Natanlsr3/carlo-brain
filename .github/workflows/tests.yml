name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Tests (pytest)
        run: python -m pytest -q
      - name: Tests (standard library runner)
        run: python tests/run_all.py
      - name: Installer smoke test in a temporary HOME
        run: |
          export HOME="$(mktemp -d)"
          ./install.sh --yes --vault "$HOME/vault" --modules memory,security,sync
          # doctor exits 0 when healthy and non-zero on a failed check (warnings alone are fine): let it fail the job.
          "$HOME/.local/bin/carlo" doctor
          "$HOME/.local/bin/carlo" uninstall --purge
