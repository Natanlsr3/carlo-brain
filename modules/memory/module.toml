name = "memory"
summary = "Session memory: boot context, automatic log entries, compaction summaries, fact queue, quality score, health line"
version = "0.1.0"
requires = []
deps = ["python3"]
optional_deps = ["claude"]
platforms = ["macos", "linux"]

[[hooks]]
event = "SessionStart"
matcher = "startup|clear|compact"
command = "{PY} -I {CODE}/boot.py"
timeout = 10

[[hooks]]
event = "SessionEnd"
command = "{PY} -I {CODE}/session_end.py"
timeout = 10

[[hooks]]
event = "PreCompact"
command = "{PY} -I {CODE}/precompact.py"
timeout = 10

# Once a day at 10:00 (launchd runs a missed slot after wake). The script acts at most every 6 days, needs the
# earlier consent from `carlo scan --yes`, and only writes a short boot.d note. On Linux the CLI prints a cron line.
[[launchd]]
label = "map-refresh"
command = "{PY} -I {CODE}/refresh.py run"
hour = 10
minute = 0
